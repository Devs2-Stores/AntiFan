<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Windows Terminal (PowerShell)</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: file:; font-src 'self' data:;" />
  <link rel="stylesheet" href="terminal.css" />
</head>
<body>
  <div class="wt-container">
    <div id="terminalTopResizeHandle" class="wt-top-resize-handle" title="Kéo để chỉnh độ cao Terminal"></div>
    <!-- WINDOWS TERMINAL TAB STRIP -->
    <div class="wt-tab-strip">
      <div class="wt-tabs">
        <div class="wt-tab active" title="PowerShell">
          <div class="wt-tab-icon">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
              <rect width="16" height="16" rx="2" fill="#012456"/>
              <path d="M4 4.5L7.5 8L4 11.5" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <line x1="8.5" y1="12" x2="12.5" y2="12" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="wt-tab-title">PowerShell</span>
          <button class="wt-tab-vscode" id="btnTabVSCode" title="Mở thư mục Terminal này trong VS Code (Open in VS Code)">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 2.5v11l-4.5-2.1L6 13.5V2.5l3.5 2.1L14 2.5z"/><path d="M2 4.5v7"/>
            </svg>
          </button>
          <button class="wt-tab-close" id="btnTabClose" title="Close Pane">✕</button>
        </div>
        <button class="wt-tab-new-btn" id="btnTabNew" title="New Terminal (Ctrl+Shift+`)">+</button>
        <button class="wt-tab-dropdown-btn" id="btnTabDropdown" title="Shell Selection (PowerShell, CMD, Git Bash)">˅</button>
        <div class="wt-shell-dropdown-menu" id="shellDropdownMenu" style="display:none;">
          <div class="wt-shell-item" data-shell="powershell">
            <span class="wt-shell-icon">🔷</span>
            <span>PowerShell (Default)</span>
          </div>
          <div class="wt-shell-item" data-shell="cmd">
            <span class="wt-shell-icon">⬛</span>
            <span>Command Prompt (cmd.exe)</span>
          </div>
          <div class="wt-shell-item" data-shell="bash">
            <span class="wt-shell-icon">🟨</span>
            <span>Git Bash</span>
          </div>
          <div class="wt-shell-sep"></div>
          <div class="wt-shell-item" data-shell="vscode" title="Mở thư mục Terminal trong VS Code">
            <span class="wt-shell-icon" style="color:#38bdf8;">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2.5v11l-4.5-2.1L6 13.5V2.5l3.5 2.1L14 2.5z"/><path d="M2 4.5v7"/>
              </svg>
            </span>
            <span>Open in VS Code</span>
          </div>
          <div class="wt-shell-sep"></div>
          <div class="wt-shell-item" data-shell="restart">
            <span class="wt-shell-icon">🔄</span>
            <span>Restart Terminal</span>
          </div>
          <div class="wt-shell-item" data-shell="clear">
            <span class="wt-shell-icon">🗑️</span>
            <span>Clear Output (cls)</span>
          </div>
        </div>
      </div>

      <!-- QUICK CHIP ACTIONS (Antigravity & Haravan Tools) -->
      <div class="wt-quick-actions">
        <button class="wt-chip-btn wt-chip-vscode" id="btnChipVSCode" title="Mở Workspace / CWD trong VS Code">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:3px;">
            <path d="M14 2.5v11l-4.5-2.1L6 13.5V2.5l3.5 2.1L14 2.5z"/><path d="M2 4.5v7"/>
          </svg>VS Code
        </button>
        <button class="wt-chip-btn" data-cmd="hrv theme dev">⚡ hrv theme dev</button>
        <button class="wt-chip-btn" data-cmd="npm run dev">▶ npm run dev</button>
        <button class="wt-chip-btn" data-cmd="git status">git status</button>
        <button class="wt-chip-btn" data-cmd="cls">cls</button>
      </div>

      <!-- RIGHT WINDOW CONTROLS -->
      <div class="wt-controls">
        <button id="btnTerminalVSCode" class="wt-ctrl-btn" title="Open Workspace in VS Code (Ctrl+Shift+E)">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2.5v11l-4.5-2.1L6 13.5V2.5l3.5 2.1L14 2.5z"/><path d="M2 4.5v7"/>
          </svg>
        </button>
        <button id="btnTerminalRestart" class="wt-ctrl-btn" title="Restart PowerShell">🔄</button>
        <button id="btnTerminalKill" class="wt-ctrl-btn" title="Stop Current Process (Ctrl+C)">⏹</button>
        <button id="btnTerminalClear" class="wt-ctrl-btn" title="Clear Screen (cls)">🗑️</button>
        <button id="btnTerminalPopout" class="wt-ctrl-btn" title="Pop out into separate window (⧉)">⧉</button>
        <button id="btnTerminalClose" class="wt-ctrl-btn wt-close-btn" title="Hide Terminal (Esc / Ctrl+`)">✕</button>
      </div>
    </div>

    <!-- TERMINAL SCREEN BODY -->
    <div id="terminalBody" class="wt-terminal-body">
      <div id="terminalOutput" class="wt-terminal-output"></div>
      <div class="wt-prompt-row" id="promptRow">
        <span class="wt-prompt-prefix" id="promptPrefix">PS&gt;</span>
        <div class="wt-input-wrapper">
          <input type="text" id="terminalCmdInput" class="wt-cmd-input" spellcheck="false" autocomplete="off" autofocus />
          <span class="wt-cursor">█</span>
        </div>
      </div>
      <div id="wtToast" class="wt-toast" style="display:none;"></div>
    </div>
  </div>

  <script src="terminal.js"></script>
</body>
</html>
