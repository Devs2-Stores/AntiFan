<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AntiFan Session Sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="brand">
        <div class="logo">AF</div>
        <div class="title-group">
          <h1>AntiFan Browser</h1>
          <span class="subtitle">Session & Cookie Bridge</span>
        </div>
      </div>
      <div id="status-badge" class="badge checking">
        <span class="dot"></span>
        <span id="status-text">Đang kết nối...</span>
      </div>
    </div>

    <div class="content">
      <div class="stats-grid">
        <div class="stat-box">
          <span class="stat-value" id="cookie-count">--</span>
          <span class="stat-label">Cookies sẵn sàng</span>
        </div>
        <div class="stat-box">
          <span class="stat-value" id="google-status">⚡</span>
          <span class="stat-label">Google / Gmail</span>
        </div>
      </div>

      <div class="token-section" id="token-section">
        <div class="token-label-row">
          <label for="bridge-token">Mã Bridge Token kết nối:</label>
          <button type="button" id="paste-token-btn" class="btn-text" title="Dán token từ clipboard">Dán</button>
        </div>
        <div class="token-input-wrapper">
          <input type="password" id="bridge-token" placeholder="Dán token từ AntiFan Desktop..." />
          <button type="button" id="toggle-token-btn" class="btn-icon" title="Hiện/Ẩn token">👁️</button>
        </div>
        <span class="token-help">Lấy token trong <code>~/.antifan/bridge.json</code> hoặc menu AntiFan</span>
      </div>

      <div class="actions">
        <button id="sync-btn" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
          </svg>
          <span>Đồng bộ ngay sang AntiFan</span>
        </button>
      </div>

      <div id="result-message" class="message hidden"></div>
    </div>

    <div class="footer">
      <span>AntiFan Desktop 1.3.0</span>
      <span id="port-indicator" class="port-tag">Port: --</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
