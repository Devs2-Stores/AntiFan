                - text: ). Mutually exclusive with
                - code [ref=f6e196]: builtin
                - text: .
              - listitem [ref=f6e197]:
                - strong [ref=f6e198]:
                  - code [ref=f6e199]: builtin
                - text: "(string): Builtin command to execute. Currently supports"
                - code [ref=f6e200]: schedule
                - text: . Mutually exclusive with
                - code [ref=f6e201]: command
                - text: .
              - listitem [ref=f6e202]:
                - strong [ref=f6e203]:
                  - code [ref=f6e204]: args
                - text: "(string[]): Optional. Arguments passed to the command or builtin function."
              - listitem [ref=f6e205]:
                - strong [ref=f6e206]:
                  - code [ref=f6e207]: restart_policy
                - text: "(string): Optional. Restart behavior. One of"
                - code [ref=f6e208]: always
