              - heading "Sidecars" [level=1] [ref=f6e143]
              - link "Section titled “Sidecars”" [ref=f6e144] [cursor=pointer]:
                - /url: "#sidecars"
            - paragraph [ref=f6e149]: Sidecars are background processes that run alongside Antigravity. Antigravity manages the lifecycle of sidecars, automatically launching them and restarting them if they crash or error. They are useful for persistent background scripts, scheduled recurring tasks, and reacting to events.
            - generic [ref=f6e150]:
              - heading "Configuration" [level=2] [ref=f6e151]
              - link "Section titled “Configuration”" [ref=f6e152] [cursor=pointer]:
                - /url: "#configuration"
            - paragraph [ref=f6e157]:
              - text: Sidecars are discovered by searching for
              - code [ref=f6e158]: sidecar.json
              - text: "configuration files. They can be defined in two locations:"
            - list [ref=f6e159]:
              - listitem [ref=f6e160]:
                - text: "Global sidecars: Under"
                - code [ref=f6e161]: ~/.gemini/config/sidecars/
              - listitem [ref=f6e162]:
                - text: "Plugin sidecars: Under"
                - code [ref=f6e163]: ~/.gemini/config/plugins/<pluginName>/sidecars/
            - paragraph [ref=f6e164]:
              - text: Each sidecar has its own directory and the directory name is used as the sidecar’s ID. Sidecars loaded from plugins have the ID
              - code [ref=f6e165]: <pluginName>/<sidecarName>
              - text: .
            - paragraph [ref=f6e166]:
              - text: The sidecar’s directory must contain a
              - code [ref=f6e167]: sidecar.json
              - text: file and may also contain other helper files like scripts to run. The sidecar’s directory also acts as the current working directory for the sidecar’s command.
            - paragraph [ref=f6e168]: Example directory structure
            - generic [ref=f6e169]:
              - code [ref=f6e170]:
                - generic [ref=f6e171]: ~/.gemini/config/sidecars/
                - generic [ref=f6e172]: ├── sidecar1/
                - generic [ref=f6e173]: │ ├── sidecar.json
                - generic [ref=f6e174]: │ └── script.py
                - generic [ref=f6e175]: └── sidecar2/
                - generic [ref=f6e176]: └── sidecar.json
                - generic [ref=f6e177]: ~/.gemini/config/plugins/
                - generic [ref=f6e178]: └── my-plugin/
                - generic [ref=f6e179]: └── sidecars/
                - generic [ref=f6e180]: └── plugin-sidecar/
                - generic [ref=f6e181]: └── sidecar.json
              - button "Copy code to clipboard" [ref=f6e182] [cursor=pointer]: content_copy
            - generic [ref=f6e183]:
              - heading "Config Schema (sidecar.json)" [level=3] [ref=f6e184]
              - link "Section titled “Config Schema (sidecar.json)”" [ref=f6e185] [cursor=pointer]:
                - /url: "#config-schema-sidecarjson"
            - list [ref=f6e190]:
              - listitem [ref=f6e191]:
                - strong [ref=f6e192]:
