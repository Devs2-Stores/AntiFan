<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>invisible-click-blocker bad</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:16px/1.5 Arial,sans-serif;color:#111;background:#fff}
.btn{display:inline-block;border:1px solid #111;background:#fff;color:#111;font:16px/1.5 Arial,sans-serif;padding:0 20px;cursor:pointer}
.box{position:relative;padding:40px}
.wrap{position:relative;display:inline-block}
.ghost{position:absolute;inset:0;z-index:5}
</style>
</head>
<body>
<main class="box">
<h1>Product</h1>
<div class="wrap"><button class="btn" type="button" style="height:60px;width:220px">Buy now</button><div class="ghost"></div></div>
</main>
</body>
</html>
