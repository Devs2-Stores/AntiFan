<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>text-overlap good</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:16px/1.5 Arial,sans-serif;color:#111;background:#fff}
.btn{display:inline-block;border:1px solid #111;background:#fff;color:#111;font:16px/1.5 Arial,sans-serif;padding:0 20px;cursor:pointer}
.stage{position:relative;height:320px}
.stage>*{position:absolute;margin:0;white-space:nowrap}
</style>
</head>
<body>
<main class="stage">
<div class="watermark" aria-hidden="true" style="top:60px;left:0;font-size:160px;line-height:1;color:#eee">404</div>
<h1 style="top:110px;left:40px;font-size:32px">Page not found</h1>
</main>
</body>
</html>
