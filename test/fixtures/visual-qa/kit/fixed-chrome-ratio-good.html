<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fixed-chrome-ratio good</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:16px/1.5 Arial,sans-serif;color:#111;background:#fff}
.top{position:fixed;top:0;left:0;right:0;height:56px;z-index:20;background:#fff;border-bottom:1px solid #ccc;padding:0 16px;display:flex;align-items:center}
.bottom{position:fixed;left:0;right:0;bottom:0;height:56px;z-index:20;background:#fff;border-top:1px solid #ccc;display:flex}
.bottom a{flex:1 1 0;display:flex;align-items:center;justify-content:center;color:#111;text-decoration:none}
main{padding:76px 24px 76px}
</style>
</head>
<body>
<header class="top"><strong>Brand</strong></header>
<main>
<h1>Products</h1>
<p>Plain readable content that scrolls under neither bar.</p>
</main>
<nav class="bottom"><a href="/">Home</a><a href="/cart">Cart</a></nav>
</body>
</html>
