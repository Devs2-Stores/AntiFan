<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tap-target-hit-area good</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:16px/1.5 Arial,sans-serif;color:#111;background:#fff}
.btn{display:inline-block;border:1px solid #111;background:#fff;color:#111;font:16px/1.5 Arial,sans-serif;padding:0 20px;cursor:pointer}
.sw-row{display:flex;gap:24px;padding:24px}
.sw{display:block;width:16px;height:16px;border-radius:50%;background:#b00}
.sw:nth-child(2){background:#08a}.sw:nth-child(3){background:#2a2}
.sw{position:relative}
.sw::before{content:"";position:absolute;inset:min(0px,calc((16px - 24px) / 2))}
</style>
</head>
<body>
<main>
<h1>Colour</h1>
<div class="sw-row">
<a class="sw" href="#red" aria-label="Red"></a>
<a class="sw" href="#blue" aria-label="Blue"></a>
<a class="sw" href="#green" aria-label="Green"></a>
</div>
</main>
</body>
</html>
