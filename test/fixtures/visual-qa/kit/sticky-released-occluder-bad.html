<title>sticky-released-occluder bad</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:16px/1.5 Arial,sans-serif;color:#111;background:#fff}

.fill{height:1400px}
.gallery{position:sticky;top:0;height:300px}

<body>
<header class="hdr"><span>Header</span></header>
<div class="spacer"></div>
<div class="row"><div class="gallery"><span>Gallery stuck under the header</span></div><div style="padding:24px"><p>Details column</p></div></div>
