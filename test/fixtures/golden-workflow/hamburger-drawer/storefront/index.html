<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden Test Store — Navigation Drawer</title>
  <link rel="stylesheet" href="/assets/component-drawer.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#main-content">AntiFan Supply</a>
    <button id="menu-toggle" class="menu-toggle" type="button" aria-controls="site-drawer" aria-expanded="false">
      <span aria-hidden="true">☰</span>
      <span>Menu</span>
    </button>
  </header>
  <main id="main-content">
    <h1>Live storefront navigation proof</h1>
    <p>The drawer must open from a trusted Chromium gesture without horizontal overflow.</p>
  <button id="noop-action" class="noop-action" type="button">No-op control</button>
  </main>
  <aside id="site-drawer" class="drawer" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Store navigation">
    <nav>
      <a href="#new">New arrivals</a>
      <a href="#catalog">Catalog</a>
      <a href="#contact">Contact</a>
    </nav>
  </aside>
  <div id="drawer-scrim" class="drawer-scrim" aria-hidden="true"></div>
  <script>
    window.drawerActions = [];
    const toggle = document.getElementById('menu-toggle');
    const drawer = document.getElementById('site-drawer');
    const scrim = document.getElementById('drawer-scrim');
    toggle.addEventListener('click', (event) => {
      window.drawerActions.push({ type: 'click', isTrusted: Boolean(event.isTrusted), time: performance.now() });
      const open = !drawer.classList.contains('open');
      drawer.classList.toggle('open', open);
      scrim.classList.toggle('open', open);
      document.body.classList.toggle('drawer-open', open);
      toggle.setAttribute('aria-expanded', String(open));
      drawer.setAttribute('aria-hidden', String(!open));
    });
  </script>
</body>
</html>
